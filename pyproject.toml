[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qdetect"
version = "0.1.0"
description = "Pipeline comune per valutare rilevatori quantistici e classici sul dataset RF reale"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn"]

[project.optional-dependencies]
quantum = ["pennylane"]
test = ["pytest"]

[tool.setuptools]
packages = ["qdetect"]
